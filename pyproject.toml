[project]
name = "agritech-crop-reco"
version = "0.1.0"
description = "Prédiction de rendement agricole et recommandation de cultures (FastAPI + Streamlit + MLflow)"
authors = [{ name = "Maxime Barbier" }]
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<3.0",
    "scikit-learn>=1.5,<2.0",
    "joblib>=1.4,<2.0",
    "pydantic>=2.7,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "agritech_crop_reco", from = "src" }]

# Entraînement et suivi des expériences (SQLite local ou Neon via MLFLOW_TRACKING_URI)
[tool.poetry.group.ml.dependencies]
mlflow = ">=2.14,<4.0"
psycopg2-binary = ">=2.9,<3.0"

# Back-end
[tool.poetry.group.api.dependencies]
fastapi = ">=0.115,<1.0"
uvicorn = { version = ">=0.30,<1.0", extras = ["standard"] }

# Front-end (aucune logique ML)
[tool.poetry.group.front.dependencies]
streamlit = ">=1.38,<2.0"
requests = ">=2.32,<3.0"
plotly = ">=5.22,<7.0"

# Notebooks d'exploration
[tool.poetry.group.eda.dependencies]
matplotlib = ">=3.9,<4.0"
seaborn = ">=0.13,<1.0"
scipy = ">=1.13,<2.0"
ipykernel = ">=6.29"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3"
pytest-cov = ">=5.0"
httpx = ">=0.27"
ruff = ">=0.6"
black = ">=24.8"
nbclient = "^0.11.0"
nbformat = "^5.11.1"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/agritech_crop_reco", "api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.black]
line-length = 100
target-version = ["py311"]
