name: CI

on:
  pull_request:
  push:
    branches: [develop]   # branche d'intégration (après chaque merge de PR)
  workflow_call:          # réutilisé par cd.yml : tests -> build -> déploiement sur main

# Une seule exécution à la fois par branche. Sur une PR, une nouvelle poussée annule la
# précédente (devenue obsolète). Sur develop et main, on n'annule JAMAIS : un commit dont la CI
# a été annulée garde un contrôle « annulé », que le ruleset traite comme un échec, ce qui
# bloque ensuite la PR de release qui pointe sur ce même commit (cas de la v1.3.0).
# (github.workflow = "CD" quand ce fichier est appelé par cd.yml : pas de conflit de groupe)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  POETRY_VERSION: "2.3.4"

jobs:
  branch-guard:
    name: Branche cible
    # Seulement sur les PR (sauté sur develop et quand cd.yml réutilise ce workflow)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Seules release/… et hotfix/… peuvent viser main (git flow)
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$BASE" = "main" ] && [[ ! "$HEAD" =~ ^(release|hotfix)/ ]]; then
            echo "::error::PR de '$HEAD' vers main refusée : seules les branches release/… ou hotfix/… peuvent viser main. Changez la base de la PR en develop."
            exit 1
          fi
          echo "OK : $HEAD -> $BASE"

  quality:
    name: Qualité (ruff, black, pytest)
    runs-on: ubuntu-latest
    env:
      # En local, poetry.toml (create = false) installe dans l'env conda actif.
      # En CI, il n'y a pas de conda : sans cette surcharge, Poetry (installé par pipx sur
      # le Python système 3.14 du runner) installerait dans ce Python système et échouerait
      # sur les paquets Debian. On force donc un venv isolé, basé sur le Python 3.11 ci-dessous.
      POETRY_VIRTUALENVS_CREATE: "true"
    steps:
      - uses: actions/checkout@v7

      - name: Installer Poetry
        run: pipx install "poetry==${POETRY_VERSION}"

      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: "3.11"
          cache: poetry

      - name: Installer les dépendances (venv Python 3.11)
        run: |
          poetry env use "${{ steps.python.outputs.python-path }}"
          poetry check --lock
          poetry install --with ml,api,front,dev
          poetry run python --version

      - name: ruff
        run: poetry run ruff check .

      - name: black
        run: poetry run black --check .

      # data/processed (versionné) et models/ (versionné) suffisent : pas de données brutes.
      - name: Tests
        run: poetry run pytest --cov --cov-report=term-missing

  docker:
    name: Images Docker (API et front)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7

      # Même commande qu'en local : construit les deux images, démarre l'API puis le front
      # (le front attend le HEALTHCHECK de l'API) et patiente jusqu'à ce que tout soit « healthy ».
      - name: Construire et démarrer l'application
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Vérifier l'API
        run: |
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS -X POST http://127.0.0.1:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"crop":"Wheat","avg_temp_c":18.5,"rainfall_mm":900,"pesticides_tonnes":12000}'
          curl -fsS -X POST http://127.0.0.1:8000/recommend \
            -H "Content-Type: application/json" \
            -d '{"avg_temp_c":18.5,"rainfall_mm":900,"pesticides_tonnes":12000}'

      - name: Vérifier le front et sa liaison avec l'API
        run: |
          curl -fsS http://127.0.0.1:8501/_stcore/health
          # Le front voit l'API par son nom de service (API_URL=http://api:8000)
          docker compose exec -T front python -c "import api_client; print(api_client.health())"

      - name: Logs des conteneurs (en cas d'échec)
        if: failure()
        run: docker compose logs

      - name: Arrêter l'application
        if: always()
        run: docker compose down
