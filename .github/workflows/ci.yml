name: CI

on:
  push:
    branches: [main]
  pull_request:

# Une seule exécution par branche : une nouvelle poussée annule la précédente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  POETRY_VERSION: "2.3.4"

jobs:
  quality:
    name: Qualité (ruff, black, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Poetry
        run: pipx install "poetry==${POETRY_VERSION}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: poetry

      # poetry.toml : virtualenvs.create = false -> installation dans le Python de la CI
      - name: Installer les dépendances
        run: |
          poetry check --lock
          poetry install --with ml,api,front,dev

      - name: ruff
        run: ruff check .

      - name: black
        run: black --check .

      # data/processed (versionné) et models/ (versionné) suffisent : pas de données brutes.
      - name: Tests
        run: pytest --cov --cov-report=term-missing

  docker:
    name: Images Docker (API et front)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image
        run: docker build -f api/Dockerfile -t agritech-crop-api .

      - name: Démarrer le conteneur et vérifier l'API
        run: |
          docker run -d --name api -p 8000:8000 agritech-crop-api
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS -X POST http://127.0.0.1:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"crop":"Wheat","avg_temp_c":18.5,"rainfall_mm":900,"pesticides_tonnes":12000}'
          curl -fsS -X POST http://127.0.0.1:8000/recommend \
            -H "Content-Type: application/json" \
            -d '{"avg_temp_c":18.5,"rainfall_mm":900,"pesticides_tonnes":12000}'

      - name: Construire l'image du front et le relier à l'API
        run: |
          docker build -f frontend/Dockerfile -t agritech-crop-front .
          docker network create agri
          docker rm -f api
          docker run -d --name api --network agri agritech-crop-api
          docker run -d --name front --network agri -p 8501:8501 agritech-crop-front
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8501/_stcore/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8501/_stcore/health
          # Le front voit l'API par son nom de service (API_URL=http://api:8000 par défaut)
          docker exec front python -c "import api_client; print(api_client.health())"

      - name: Logs des conteneurs (en cas d'échec)
        if: failure()
        run: |
          docker logs api
          docker logs front
